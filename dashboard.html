<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="script" href="script.js">
</head>

<body>
  <nav class="navbar">

    <div class="logo">Employee MS </div>
    <div class="logo">Welcome Admin</div>
    <ul class="nav-links">
      <div><Button>Logout</Button></div>
    </ul>
    <ul class="nav-links">

      <button id="settingsToggle">Settings</button>

      <div id="settingsPanel">
        <h3>Settings</h3>

        <div class="section">
          <div class="toggle">Mode</div>
          <div class="toggle"> Contrast </div>

        </div>


        <div class="section" style="margin-top: 10px;">
          <div class="toggle">Right to Left</div>
          <div class="toggle"> Compact</div>
        </div>

        <h4>Layout</h4>
        <div class="section">
          <div class="option">side</div>
          <div class="option">bottom</div>
          <div class="option">top</div>
        </div>

        <div class="section">
          <div class="option_2"> Integrate</div>
          <div class="option_2"> Apparent</div>
        </div>

        <h4>Presets</h4>
        <div class="section">
          <div class="preset" style="background: #2af173;"></div>
          <div class="preset" style="background: #b89cff;"></div>
          <div class="preset" style="background: #30c5e3;"></div>
          <div class="preset" style="background: #b89cff;"></div>
          <div class="preset" style="background: #e8de99;"></div>
          <div class="preset" style="background: #82484f;"></div>
        </div>

        <h4>Font</h4>
        <div class="section">
          <div class="font-option">Public Sans</div>
          <div class="font-option">Inter</div>
          <div class="font-option">DM Sans</div>
          <div class="font-option">Nunito Sans</div>
        </div>


</body>

</html>
