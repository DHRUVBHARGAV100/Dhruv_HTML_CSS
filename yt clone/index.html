<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Clone</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Menu</h2>
      <ul>
        <li>Home</li>
        <li>Trending</li>
        <li>Subscriptions</li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <input type="text" id="searchInput" placeholder="Search videos..." />
        <button onclick="searchVideos()">Search</button>
      </header>

      <section class="video-grid" id="videoGrid">
        <div class="video-card" data-title="How to Learn HTML">
          <img src="https://via.placeholder.com/300x180" alt="Video Thumbnail" />
          <h3>How to Learn HTML</h3>
        </div>
        <div class="video-card" data-title="CSS Basics Tutorial">
          <img src="https://via.placeholder.com/300x180" alt="Video Thumbnail" />
          <h3>CSS Basics Tutorial</h3>
        </div>
        <div class="video-card" data-title="JavaScript for Beginners">
          <img src="https://via.placeholder.com/300x180" alt="Video Thumbnail" />
          <h3>JavaScript for Beginners</h3>
        </div>
        <div class="video-card" data-title="React in 10 Minutes">
          <img src="https://via.placeholder.com/300x180" alt="Video Thumbnail" />
          <h3>React in 10 Minutes</h3>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
