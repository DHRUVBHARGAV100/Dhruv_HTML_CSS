<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dodge game</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(
          45deg,
          rgb(93, 138, 204),
          rgb(191, 60, 205)
        );
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .game {
        width: 700px;
        height: 350px;
        background: linear-gradient(
          135deg,
          rgb(214, 211, 211),
          rgb(223, 213, 213)
        );
        border: 4px solid white;
        border-radius: 16px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        position: relative;
        cursor: pointer;
      }

      .player {
        width: 60px;
        height: 60px;
        background: linear-gradient(
          45deg,
          rgb(126, 162, 217),
          rgb(223, 116, 235)
        );
        border-radius: 50%;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        left: 20px;
        animation: playerMove 3s ease-in-out;
        animation-play-state: paused;
      }

      .enemy {
        width: 50px;
        height: 50px;
        background: linear-gradient(45deg, rgb(203, 16, 16), rgb(11, 9, 11));
        border-radius: 8px;
        position: absolute;
        animation: enemyBounce 3s ease-in-out infinite;
      }

      .enemy.one {
        left: 200px;
        animation-delay: 0;
        animation-duration: 2.5s;
      }

      .enemy.two {
        left: 350px;
        animation-delay: -1.2s;
        animation-duration: 3.5s;
      }

      .enemy.three {
        left: 500px;
        animation-delay: -2s;
        animation-duration: 2.8s;
      }

      .game:active .player {
        animation-play-state: running;
      }

      @keyframes playerMove {
        0% {
          left: 20px;
        }

        100% {
          left: 600px;
        }
      }

      @keyframes enemyBounce {
        0%,
        100% {
          top: 0;
          transform: rotate(0deg);
        }

        50% {
          top: 280px;
          transform: rotate(180deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="player"></div>
      <div class="enemy one"></div>
      <div class="enemy two"></div>
      <div class="enemy three"></div>
    </div>
  </body>
</html>
