<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    div {
        width: 100%;
        height: 100%;
        margin: 20px;
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
    }
    .img1 {
        background-image: url('weather/image.png');
        background-size: cover;
        background-position: center;
    }
    .img2 {
        background-image: url('weather/img.png');
        background-size: cover;
        background-position: center;

    }
</style>
<body>
    <div class="img1"><h2>img1</h2></div>
    <div class="img2"><h2>img2</h2></div>
</body>
</html>
