<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="weather-container">
    <input type="text" placeholder="Enter a City..." class="search-box">
    <div class="current-weather">
      <div class="icon">☀️</div>
      <div class="weather-info">
        <h2>Indore , Nanda Nagar</h2>
        <p><b>Temperature: 30'C</b></p>
        <p><b>Clear Sky</b></p>
      </div>
    </div>

    <div class="forecast">
      <div class="day">
        <p>Wednesday</p>
        <div class="icon">☀️</div>
        <p>21'C</p>
      </div>
      <div class="day">
        <p>Thursday</p>
        <div class="icon">☁️</div>
        <p>24  C</p>
      </div>
      <div class="day">
        <p>Friday</p>
        <div class="icon">☀️</div>
        <p>21'C</p>
      </div>
      <div class="day">
        <p>Saturday</p>
        <div class="icon">⛅</div>
        <p>24'C</p>
      </div>
    </div>
  </div>
</body>
</html>
